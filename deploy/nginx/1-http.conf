# TAHAP 1 — HTTP saja (sebelum sertifikat ada).
# Salin ke /etc/nginx/conf.d/monju.dwiputraasana.my.id.conf, reload nginx, lalu minta sertifikat:
#   certbot certonly --webroot -w /var/www/certbot -d monju.dwiputraasana.my.id
# Setelah berhasil, timpa file yang sama dengan 2-https.conf.
# Jangan arahkan agent ke server selama masih tahap ini (token terkirim tanpa enkripsi).

server {
    listen 80;
    listen [::]:80;
    server_name monju.dwiputraasana.my.id;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
