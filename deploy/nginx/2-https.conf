# TAHAP 2 — HTTPS (setelah sertifikat dari tahap 1 ada).
# Timpa /etc/nginx/conf.d/monju.dwiputraasana.my.id.conf dengan file ini, lalu: nginx -t && systemctl reload nginx
# Reverse proxy untuk Judol Monitor (container di 127.0.0.1:8000).

limit_req_zone $binary_remote_addr zone=judol_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=judol_dash:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name monju.dwiputraasana.my.id;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monju.dwiputraasana.my.id;

    ssl_certificate     /etc/letsencrypt/live/monju.dwiputraasana.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monju.dwiputraasana.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Server menerima laporan agent hingga 8 MB.
    client_max_body_size 8m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/report {
        limit_req zone=judol_api burst=20 nodelay;
        # Opsional: hanya IP VPS agent yang boleh melapor.
        # allow 203.0.113.10;   # vps-1
        # deny all;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        limit_req zone=judol_dash burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
}
